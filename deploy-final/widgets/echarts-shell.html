<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Visual</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: transparent;
      color: hsl(220, 6%, 13%);
      padding: 8px;
    }
    #chart { width: 100%; height: 100%; min-height: 200px; }
    .state {
      padding: 24px;
      text-align: center;
      color: hsl(220, 6%, 50%);
      font-size: 13px;
    }
    .state.error { color: #ef4444; }
    @media (prefers-color-scheme: dark) {
      body { color: hsl(0, 0% 95%); }
    }
  </style>
</head>
<body>
  <div id="chart"><div class="state">Loading…</div></div>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
  <script>
    /** INJECT_ECHARTS **/

    // Revive formatter callbacks that travel as strings: the model writes
    // "formatter": "function(p){return p.name+': '+p.value}" because real
    // functions can't cross a JSON boundary. Everything runs sandboxed.
    function reviveFunctions(node) {
      if (Array.isArray(node)) { node.forEach(reviveFunctions); return node; }
      if (node && typeof node === 'object') {
        for (const k of Object.keys(node)) {
          const v = node[k];
          if (typeof v === 'string' && /^\s*(function\s*[\w$]*\s*\(|\([^)]*\)\s*=>|[\w$]+\s*=>)/.test(v)) {
            try { node[k] = (new Function('return (' + v + ')'))(); } catch (e) { node[k] = v; }
          } else {
            reviveFunctions(v);
          }
        }
        return node;
      }
      return node;
    }

    function renderEcharts(payload) {
      var host = document.getElementById('chart');
      if (!payload || payload.error) {
        host.innerHTML = '<div class="state error">' + ((payload && payload.error) || 'No data to display') + '</div>';
        return;
      }
      if (typeof echarts === 'undefined') {
        host.innerHTML = '<div class="state error">ECharts failed to load</div>';
        return;
      }
      var option = payload.echartsOption || payload.option || payload;
      if (payload.data && option && typeof option === 'object') option.dataset = [{ source: payload.data }];
      try {
        option = reviveFunctions(option);
        var chart = echarts.init(host, null, { renderer: 'svg' });
        chart.setOption(option);
        var ro = new ResizeObserver(function () { chart.resize(); });
        ro.observe(host);
      } catch (e) {
        host.innerHTML = '<div class="state error">Render error: ' + (e && e.message ? e.message : String(e)) + '</div>';
      }
    }

    // MCP Apps path: the host forwards the tool result into this iframe.
    window.addEventListener('message', function (event) {
      try {
        var data = event.data;
        if (data && data.jsonrpc === '2.0' && data.method === 'ui/notifications/tool-result') {
          var params = data.params || {};
          var candidates = [];
          if (params.structuredContent) candidates.push(params.structuredContent);
          (params.content || []).forEach(function (c) {
            if (typeof c.text === 'string') { try { candidates.push(JSON.parse(c.text)); } catch (e) {} }
          });
          for (var i = 0; i < candidates.length; i++) {
            var p = candidates[i];
            if (p && typeof p === 'object' && (p.echartsOption || p.isEcharts)) { renderEcharts(p); return; }
          }
        }
      } catch (e) { console.error(e); }
    });
  </script>
</body>
</html>
