<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chart</title>
  <style>
    /* Flat design - no gradients, shadows, or blur */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: transparent;
      color: hsl(220, 6% 13%);
      padding: 16px;
      width: 100%;
      height: 100vh;
      box-sizing: border-box;
    }
    .dark body { color: hsl(0, 0% 95%); }
    #chart-container {
      width: 100%;
      max-width: 380px;
      height: 100%;
      min-height: 200px;
    }
    .empty-state {
      padding: 24px;
      text-align: center;
      color: hsl(220, 6% 50%);
      font-size: 13px;
    }
    @media (prefers-color-scheme: dark) {
      body { color: hsl(0, 0% 95%); }
    }
  </style>
</head>
<body>
  <div id="chart-container">
    <div id="empty-state" class="empty-state" style="display: none;">
      No data to display
    </div>
  </div>
  <!-- Chart.js from cdnjs only - pinned version -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <script>
    // Receive chart spec via postMessage from the host
    // Spec format: { type: "bar"|"pie"|"line"|"table", data: {...}, options: {...} }
    let chartInstance = null;

    function renderChart(spec) {
      const container = document.getElementById('chart-container');
      const emptyState = document.getElementById('empty-state');

      if (!spec || spec.error) {
        container.innerHTML = '<div class="empty-state">' + (spec?.error || 'No data to display') + '</div>';
        return;
      }

      if (spec.type === 'table') {
        renderTable(spec);
        emptyState.style.display = 'none';
        return;
      }

      // Check for Chart.js
      if (typeof Chart === 'undefined') {
        container.innerHTML = '<div class="empty-state">Chart.js failed to load</div>';
        return;
      }

      // Clean up previous chart
      if (chartInstance) {
        chartInstance.destroy();
        chartInstance = null;
      }

      const ctx = document.createElement('canvas');
      ctx.id = 'chart-canvas';
      ctx.setAttribute('role', 'img');
      ctx.setAttribute('aria-label', spec.title || spec.type + ' chart');
      container.innerHTML = '';
      container.appendChild(ctx);

      const chartConfig = {
        type: spec.type,
        data: spec.data || {},
        options: {
          responsive: true,
          maintainAspectRatio: false,
          animation: { duration: 200 },
          plugins: {
            legend: {
              labels: {
                font: { size: 12 },
                padding: 14,
                usePointStyle: true,
              }
            },
            tooltip: {
              enabled: true,
              callbacks: {
                label: function(context) {
                  var value = context.parsed.y;
                  return context.dataset.label + ': ' + formatNumber(value);
                }
              }
            }
          },
          scales: spec.type !== 'pie' ? {
            x: {
              grid: { display: false },
              ticks: { font: { size: 11 }, maxRotation: 0 }
            },
            y: {
              grid: { color: 'hsl(220, 20%, 90%)' },
              ticks: {
                font: { size: 11 },
                callback: function(value) { return formatNumber(value); }
              }
            }
          } : undefined,
          ...spec.options
        }
      };

      chartInstance = new Chart(ctx, chartConfig);
      emptyState.style.display = 'none';
    }

    function formatNumber(value) {
      if (typeof value === 'number') {
        if (value >= 1000) {
          return '₹' + value.toLocaleString('en-IN');
        }
        return value.toString();
      }
      return String(value);
    }

    function renderTable(spec) {
      const container = document.getElementById('chart-container');
      const columns = spec.columns || [];
      const rows = spec.rows || [];

      var table = document.createElement('table');
      table.style.width = '100%';
      table.style.borderCollapse = 'collapse';
      table.setAttribute('aria-label', spec.title || 'Data table');

      var thead = document.createElement('thead');
      var headerRow = document.createElement('tr');
      columns.forEach(function(col) {
        var th = document.createElement('th');
        th.textContent = col;
        th.style.textAlign = 'left';
        th.style.padding = '6px 8px';
        th.style.fontSize = '12px';
        th.style.fontWeight = '600';
        th.style.color = 'hsl(220, 6%, 40%)';
        th.style.borderBottom = '1px solid hsl(220, 20%, 90%)';
        headerRow.appendChild(th);
      });
      thead.appendChild(headerRow);
      table.appendChild(thead);

      var tbody = document.createElement('tbody');
      rows.forEach(function(row) {
        var tr = document.createElement('tr');
        columns.forEach(function(col) {
          var td = document.createElement('td');
          var val = row[col];
          td.textContent = val === null || val === undefined ? '—' : String(val);
          td.style.padding = '6px 8px';
          td.style.fontSize = '12px';
          td.style.borderBottom = '1px solid hsl(220, 20%, 90%)';
          tr.appendChild(td);
        });
        tbody.appendChild(tr);
      });
      table.appendChild(tbody);

      container.innerHTML = '';
      container.appendChild(table);
    }

    window.addEventListener('message', function(event) {
      // Validate origin - the host should send its origin
      try {
        var data = event.data;
        // MCP Apps ui/notifications/tool-result format
        if (data && data.jsonrpc === '2.0' && data.method === 'ui/notifications/tool-result') {
          var params = data.params || {};
          var content = params.content || [];
          // Extract the chart spec from the first text content block
          for (var i = 0; i < content.length; i++) {
            if (content[i].type === 'text' || content[i].type === 'text/plain') {
              var text = content[i].text || '';
              try {
                var parsed = JSON.parse(text);
                // If the parsed object has a spec, use that; otherwise treat the parsed object itself as the spec
                if (parsed.spec) {
                  renderChart(parsed.spec);
                } else if (parsed.type === 'bar' || parsed.type === 'pie' || parsed.type === 'table' || parsed.type === 'line') {
                  renderChart(parsed);
                } else if (parsed.html) {
                  var inner = JSON.parse(parsed.html);
                  if (inner.spec) {
                    renderChart(inner.spec);
                  } else if (inner.type === 'bar' || inner.type === 'pie' || inner.type === 'table' || inner.type === 'line') {
                    renderChart(inner);
                  }
                }
              } catch (e) {
                // Not JSON, ignore
              }
            }
          }
          // Also try structuredContent if present
          if (params.structuredContent) {
            var sc = params.structuredContent;
            if (sc.html) {
              var inner = JSON.parse(sc.html);
              if (inner.spec) {
                renderChart(inner.spec);
              } else if (inner.type === 'bar' || inner.type === 'pie' || inner.type === 'table' || inner.type === 'line') {
                renderChart(inner);
              }
            } else if (sc.spec) {
              renderChart(sc.spec);
            } else if (sc.type === 'bar' || sc.type === 'pie' || sc.type === 'table' || sc.type === 'line') {
              renderChart(sc);
            }
          }
        }
      } catch (e) {
        console.error('Error rendering chart:', e);
      }
    });
  </script>
</body>
</html>
